<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f5f0" />
    <meta
      name="description"
      content="ふたりの開発を小さく前に進める、シンプルなタスクボード。"
    />
    <title>ふたりの作業ボード</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="supabase-config.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="ふたりの作業ボード ホーム">
          <span class="brand-mark" aria-hidden="true">ふ</span>
          <span>ふたりの作業ボード</span>
        </a>
        <span class="workspace-label"><span class="status-dot"></span> 開発チーム</span>
      </header>

      <main>
        <section class="intro" aria-labelledby="page-title">
          <div class="intro-copy">
            <p class="eyebrow">SMALL STEPS, BUILT TOGETHER</p>
            <h1 id="page-title">今日の一歩を、<span>ふたりで。</span></h1>
            <p class="intro-description">
              やることを並べて、進み具合を見える形に。小さなタスクから始めましょう。
            </p>
          </div>
          <button class="button button-primary intro-add" id="openTaskDialog" type="button">
            <span aria-hidden="true">＋</span> タスクを追加
          </button>
        </section>

        <section class="summary" aria-label="タスクの概要">
          <div class="summary-card">
            <span class="summary-icon icon-total" aria-hidden="true">↗</span>
            <div><span class="summary-label">すべて</span><strong id="totalCount">0</strong></div>
          </div>
          <div class="summary-card">
            <span class="summary-icon icon-active" aria-hidden="true">◷</span>
            <div><span class="summary-label">進行中</span><strong id="activeCount">0</strong></div>
          </div>
          <div class="summary-card">
            <span class="summary-icon icon-done" aria-hidden="true">✓</span>
            <div><span class="summary-label">完了</span><strong id="doneCount">0</strong></div>
          </div>
        </section>

        <section class="cloud-panel" aria-labelledby="cloudTitle">
          <div class="cloud-heading">
            <div>
              <h2 id="cloudTitle">オンライン共有</h2>
              <p id="cloudStatus">この端末に保存しています。</p>
            </div>
            <button class="button button-secondary" id="signOut" type="button" hidden>サインアウト</button>
          </div>
          <form class="cloud-auth" id="authForm">
            <label class="cloud-field">
              <span>メールアドレス</span>
              <input id="authEmail" type="email" autocomplete="username" required />
            </label>
            <label class="cloud-field">
              <span>パスワード</span>
              <input id="authPassword" type="password" autocomplete="current-password" minlength="8" required />
            </label>
            <div class="cloud-auth-actions">
              <button class="button button-primary" type="submit" data-auth-action="signin">サインイン</button>
              <button class="button button-secondary" type="submit" data-auth-action="signup">アカウントを作成</button>
            </div>
          </form>
          <div class="cloud-workspace" id="cloudWorkspace" hidden>
            <p id="signedInUser" class="cloud-user"></p>
            <div class="cloud-controls">
              <label class="cloud-field">
                <span>保存先</span>
                <select id="cloudBoardSelect">
                  <option value="">この端末に保存する</option>
                </select>
              </label>
              <div class="cloud-field">
                <label for="newBoardName">共有ボードを作成</label>
                <div class="cloud-inline-control">
                  <input id="newBoardName" type="text" maxlength="60" value="ふたりの作業ボード" />
                  <button class="button button-secondary" id="createBoard" type="button">作成</button>
                </div>
              </div>
              <div class="cloud-field">
                <label for="joinCode">招待コードで参加</label>
                <div class="cloud-inline-control">
                  <input id="joinCode" type="text" autocomplete="off" />
                  <button class="button button-secondary" id="joinBoard" type="button">参加</button>
                </div>
              </div>
              <div class="cloud-invite" id="invitePanel" hidden>
                <label for="inviteCode">このボードへの招待コード</label>
                <div class="cloud-inline-control">
                  <input id="inviteCode" type="text" readonly />
                  <button class="button button-secondary" id="copyInvite" type="button">コピー</button>
                </div>
                <button class="text-button" id="rotateInvite" type="button">新しい招待コードを発行</button>
              </div>
              <button class="button button-secondary" id="importLocalTasks" type="button" hidden>この端末のタスクを共有ボードに追加</button>
            </div>
          </div>
          <p class="cloud-message" id="cloudMessage" role="status" aria-live="polite"></p>
        </section>

        <section class="board-section" aria-label="タスクボード">
          <div class="board-toolbar">
            <div>
              <h2>プロジェクトボード</h2>
              <p>タスクを分け合って、ひとつずつ進めよう。優先度の高い順に表示します。</p>
            </div>
            <div class="filters">
              <button class="button button-secondary backup-button" id="importTasks" type="button">バックアップを読み込む</button>
              <button class="button button-secondary backup-button" id="exportTasks" type="button">バックアップを書き出す</button>
              <input id="importFile" type="file" accept="application/json,.json" hidden />
              <label class="search-box">
                <span class="visually-hidden">タスクを検索</span>
                <span aria-hidden="true">⌕</span>
                <input id="searchInput" type="search" placeholder="タスクを検索" autocomplete="off" />
              </label>
              <label class="filter-select">
                <span class="visually-hidden">担当者で絞り込む</span>
                <select id="ownerFilter">
                  <option value="all">全員</option>
                  <option value="dev-a">開発者 A</option>
                  <option value="dev-b">開発者 B</option>
                  <option value="">未割当</option>
                </select>
              </label>
              <label class="filter-select">
                <span class="visually-hidden">ラベルで絞り込む</span>
                <select id="labelFilter">
                  <option value="all">すべてのラベル</option>
                </select>
              </label>
            </div>
          </div>

          <div class="board" id="board">
            <section class="board-column column-backlog" data-status="backlog" aria-labelledby="backlogTitle">
              <div class="column-heading">
                <div class="column-title-wrap"><span class="column-marker marker-backlog"></span><h3 id="backlogTitle">これから</h3><span class="column-count" id="backlogCount">0</span></div>
                <button class="icon-button" type="button" data-action="add" data-status="backlog" aria-label="これからのタスクを追加">＋</button>
              </div>
              <div class="task-list" id="backlogTasks"></div>
            </section>

            <section class="board-column column-progress" data-status="progress" aria-labelledby="progressTitle">
              <div class="column-heading">
                <div class="column-title-wrap"><span class="column-marker marker-progress"></span><h3 id="progressTitle">進行中</h3><span class="column-count" id="progressCount">0</span></div>
                <button class="icon-button" type="button" data-action="add" data-status="progress" aria-label="進行中のタスクを追加">＋</button>
              </div>
              <div class="task-list" id="progressTasks"></div>
            </section>

            <section class="board-column column-done" data-status="done" aria-labelledby="doneTitle">
              <div class="column-heading">
                <div class="column-title-wrap"><span class="column-marker marker-done"></span><h3 id="doneTitle">完了</h3><span class="column-count" id="doneCount">0</span></div>
                <button class="icon-button" type="button" data-action="add" data-status="done" aria-label="完了のタスクを追加">＋</button>
              </div>
              <div class="task-list" id="doneTasks"></div>
            </section>
          </div>
        </section>
      </main>

      <footer class="app-footer">
        <span>小さく作って、いっしょに育てる。</span>
        <span class="local-note"><span class="lock-icon" aria-hidden="true">◈</span> ローカルまたは共有ボードに保存</span>
      </footer>
    </div>

    <dialog class="task-dialog" id="taskDialog" aria-labelledby="dialogTitle">
      <form id="taskForm">
        <div class="dialog-heading">
          <div><p class="eyebrow">BOARD TASK</p><h2 id="dialogTitle">タスクを追加</h2></div>
          <button class="icon-button dialog-close" id="closeTaskDialog" type="button" aria-label="閉じる">×</button>
        </div>
        <input id="taskId" type="hidden" />
        <label class="form-field">
          <span>タスク名 <span class="required-mark">*</span></span>
          <input id="taskTitle" name="title" type="text" maxlength="90" placeholder="例：トップページの見た目を整える" required />
        </label>
        <label class="form-field">
          <span>メモ <span class="optional-mark">任意</span></span>
          <textarea id="taskDescription" name="description" rows="3" maxlength="240" placeholder="作業の内容や共有したいこと"></textarea>
        </label>
        <div class="form-row">
          <label class="form-field">
            <span>担当</span>
            <select id="taskOwner" name="owner">
              <option value="">未割当</option>
              <option value="dev-a">開発者 A</option>
              <option value="dev-b">開発者 B</option>
            </select>
          </label>
          <label class="form-field">
            <span>優先度</span>
            <select id="taskPriority" name="priority">
              <option value="high">高</option>
              <option value="medium" selected>中</option>
              <option value="low">低</option>
            </select>
          </label>
        </div>
        <div class="form-row">
          <label class="form-field">
            <span>期限 <span class="optional-mark">任意</span></span>
            <input id="taskDueDate" name="dueDate" type="date" />
          </label>
          <label class="form-field">
            <span>進み具合</span>
            <select id="taskStatus" name="status">
              <option value="backlog">これから</option>
              <option value="progress">進行中</option>
              <option value="done">完了</option>
            </select>
          </label>
        </div>
        <label class="form-field">
          <span>ラベル <span class="optional-mark">任意・カンマ区切り</span></span>
          <input id="taskLabels" name="labels" type="text" maxlength="200" placeholder="例：デザイン, バグ修正" />
        </label>
        <div class="dialog-actions">
          <button class="button button-secondary" id="cancelTaskDialog" type="button">キャンセル</button>
          <button class="button button-primary" type="submit">保存する</button>
        </div>
      </form>
    </dialog>

    <p class="visually-hidden" id="liveMessage" role="status" aria-live="polite"></p>
    <div class="undo-bar" id="undoBar" hidden>
      <span id="undoMessage"></span>
      <button class="button button-secondary" id="undoDelete" type="button">取り消す</button>
    </div>
  </body>
</html>
